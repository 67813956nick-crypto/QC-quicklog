# ============================================================
#  QC-quicklog V7.10 — MinerU API 反向代理（宝塔 nginx）
#  作用：解决浏览器 CORS 限制 + Token 只存服务器不进前端代码
#  用法：把本文件内容粘贴进宝塔站点 nickpang.cn 的配置文件
#        （网站 → 设置 → 配置文件，放在 server { } 内部、
#          其它 location 之前），保存后宝塔会自动重载 nginx
#  ⚠️ 粘贴后把下面一处 <你的MinerU_Token> 换成真实 Token
#     （mineru.net → API管理 创建的完整 token，含前缀）
#  详细图文步骤见 docs/部署指南.md「四点五」节（方式A粘贴/方式B include）
#  ⚠️ 本文件含密钥，不要提交到 git 公开仓库！
#     仓库里只保留占位符版本；真实 token 版只放服务器
#
#  【V7.10 收尾修订，三个关键点都踩过坑】
#   1) 三段 location 必须带 `^~`：否则 .png/.jpg 等后缀命中宝塔
#      `location ~*` 图片正则被拦成 404/405
#   2) 必须加 `proxy_set_header Origin "";` + Referer 清空：
#      浏览器请求自动带 Origin 头，MinerU 后端（Spring）CORS 校验
#      会拒绝并返回 403 "Invalid CORS request"；JS 无法删 Origin
#      （禁止修改头），只能在 nginx 层清空
#   3) 前端三处路径必须用绝对路径（/mineru-api、/mineru-oss/、
#      /mineru-cdn/），工具放在 /QC-list/ 等子目录才能命中根反代
# ============================================================

# ---------- 1. MinerU API（提交任务/查询进度） ----------
location ^~ /mineru-api/ {
    proxy_pass https://mineru.net/api/;
    proxy_set_header Host mineru.net;
    proxy_set_header Authorization "Bearer <你的MinerU_Token>";
    proxy_set_header Accept "*/*";
    # 清掉浏览器自动带的来源头，避免触发 MinerU CORS 校验 403
    proxy_set_header Origin "";
    proxy_set_header Referer "";
    proxy_ssl_server_name on;
    proxy_http_version 1.1;
    proxy_read_timeout 60s;
    # 不透传客户端 Authorization（统一用服务器 token）
    proxy_hide_header Access-Control-Allow-Origin;
}

# ---------- 2. 上传预签名 OSS（PUT 扫描件） ----------
location ^~ /mineru-oss/ {
    proxy_pass https://mineru.oss-cn-shanghai.aliyuncs.com/;
    proxy_set_header Host mineru.oss-cn-shanghai.aliyuncs.com;
    proxy_set_header Origin "";
    proxy_set_header Referer "";
    proxy_ssl_server_name on;
    proxy_http_version 1.1;
    # 上传大文件：放宽体积与超时（单文件上限200MB）
    client_max_body_size 220m;
    proxy_request_buffering off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    # OSS 预签名 URL 对 Content-Type 敏感：清掉浏览器自动加的头
    proxy_set_header Content-Type "";
}

# ---------- 3. 结果 zip 下载 CDN ----------
location ^~ /mineru-cdn/ {
    proxy_pass https://cdn-mineru.openxlab.org.cn/;
    proxy_set_header Host cdn-mineru.openxlab.org.cn;
    proxy_set_header Origin "";
    proxy_set_header Referer "";
    proxy_ssl_server_name on;
    proxy_http_version 1.1;
    proxy_read_timeout 300s;
    # zip 可能几十 MB，关缓冲直接流式转发
    proxy_buffering off;
}

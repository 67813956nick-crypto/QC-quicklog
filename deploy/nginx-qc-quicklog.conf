# ============================================================
#  QC-quicklog 网页版部署配置
#  纯静态前端，无后端、无数据库、数据不上传服务器
#  适用：Linux + nginx；复制本文件到 /etc/nginx/conf.d/ 后重载
# ============================================================

# ---------- 方式一：HTTP（最快上线，公网建议再加 HTTPS） ----------
server {
    listen 80;
    # 改成你的域名或服务器公网 IP；仅内网使用可填 _ 或内网 IP
    server_name qc.example.com;

    # 站点根目录（把 deploy/index.html 放到这里）
    root /var/www/qc-quicklog;
    index index.html;

    # 字符集（必须，否则中文可能乱码）
    charset utf-8;

    # 访问控制：HTTP Basic 口令（公网部署必开）
    # 生成口令文件：  htpasswd -bc /etc/nginx/.htpasswd_qc 用户名 密码
    # 没有 htpasswd 时可用：  openssl passwd -apr1 密码  -> 手动写文件
    auth_basic           "QC材料录入 - 请输入访问口令";
    auth_basic_user_file /etc/nginx/.htpasswd_qc;

    location / {
        # 单页应用：始终回退到 index.html
        try_files $uri $uri/ /index.html;

        # HTML 不缓存，保证每次拿到最新版本
        location ~* \.html$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }

    # 静态资源可长缓存（本工具是单文件，基本用不到，留作扩展）
    location ~* \.(js|css|png|jpg|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # 上传在浏览器本机完成（FileReader），文件不传服务器
    # client_max_body_size 仅影响经服务器中转的请求，这里给个保守值即可
    client_max_body_size 10m;
}

